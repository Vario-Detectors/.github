name: Feature request
description: Propose a change or new capability
title: "[feat] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today? Who is this for?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Keep it concrete.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
